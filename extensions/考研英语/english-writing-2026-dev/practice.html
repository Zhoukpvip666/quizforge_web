<article class="question-card" aria-label="英语作文"><header class="card-head"><span class="badge">英语作文</span><span id="score-hint" class="muted"></span></header><section id="stem" class="rich-content" lang="en"></section><section><div id="answer-host" class="writing-host" aria-label="英文作文正文"></div><div id="word-count" class="word-count" role="status">0 words</div></section><section id="result-panel" class="result-panel" hidden><div class="result-heading"><h2>答案与解析</h2><span id="result-score" class="score">待评分</span></div><div id="reference-block" class="result-reference" hidden><div id="reference-answer" class="rich-content"></div></div><div id="rubric-block" class="result-reference" hidden><div id="rubric" class="rich-content"></div></div><p id="blank-note" class="review-note"></p><div id="review-panel" class="score-row"><label for="review-score">人工评分</label><input id="review-score" type="range" min="0" max="10" step="0.5" value="0"><output id="review-value">未评分</output><button id="review-retry" class="secondary" type="button" hidden>重试保存</button></div>    <section id="ai-panel" class="ai-panel" aria-labelledby="ai-heading" hidden>
      <div class="ai-heading"><h3 id="ai-heading">AI 评分</h3><span id="ai-status" role="status" aria-live="polite"></span></div>
      <p id="ai-help" class="ai-help"></p>
      <div id="ai-candidate" class="ai-candidate" hidden><strong id="ai-score"></strong><p id="ai-feedback"></p></div>
      <p id="ai-error" class="ai-error" role="alert" hidden></p>
      <div class="ai-actions"><button id="ai-grade" class="secondary" type="button">AI 评分</button><button id="ai-retry" class="secondary" type="button" hidden>重试评分</button><button id="ai-regrade" class="secondary" type="button" hidden>重新评分</button></div>
    </section>
</section><footer><span id="progress-label" class="muted" hidden></span><p id="save-notice" class="notice" role="status"></p><div class="actions"><button id="submit-button" data-qf-action="submit" class="primary" type="button">提交答案</button><button id="retry-button" data-qf-action="retry" class="secondary" type="button" hidden>再答一次</button></div></footer></article>
